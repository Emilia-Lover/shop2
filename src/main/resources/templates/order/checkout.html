<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주문서 - SHOP2</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header th:replace="~{fragments/header :: header}"></header>

<main class="container">
    <h1>주문서</h1>

    <!--
        결제하기 form
        onsubmit → 버튼을 한 번 누르면 바로 비활성화해서, 두 번 눌러 주문이 두 번 들어가는 걸 막아요
    -->
    <form th:action="@{/order}" th:object="${orderForm}" method="post"
          onsubmit="this.querySelector('.button-pay').disabled = true;">

        <!--
            무엇을 주문하는지 (화면에는 안 보이고 같이 전송돼요)
            서버는 이 번호로 DB에서 상품과 가격을 다시 꺼내요
        -->
        <input type="hidden" name="cartItemIds"
               th:each="id : *{cartItemIds}" th:value="${id}">
        <th:block th:if="*{direct}">
            <input type="hidden" name="productId" th:value="*{productId}">
            <input type="hidden" name="quantity" th:value="*{quantity}">
        </th:block>

        <!-- ===== 1. 주문 상품 ===== -->
        <h2 class="section-title">
            주문 상품
            <span class="badge" th:text="*{direct} ? '바로 구매' : '장바구니 주문'">장바구니 주문</span>
        </h2>
        <table class="cart-table">
            <thead>
            <tr>
                <th>상품</th>
                <th class="col-price">가격</th>
                <th class="col-qty">수량</th>
                <th class="col-price">합계</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="line : ${lines}">
                <td>
                    <div class="cart-product">
                        <img th:src="${line.imageUrl}" th:alt="${line.name}">
                        <div>
                            <p class="product-brand" th:text="${line.brand}">브랜드</p>
                            <p class="cart-product-name" th:text="${line.name}">상품 이름</p>
                        </div>
                    </div>
                </td>
                <td class="col-price"
                    th:text="${#numbers.formatInteger(line.price, 3, 'COMMA')} + '원'">0원</td>
                <td class="col-qty" th:text="${line.quantity} + '개'">1개</td>
                <td class="col-price cart-line-total"
                    th:text="${#numbers.formatInteger(line.totalPrice, 3, 'COMMA')} + '원'">0원</td>
            </tr>
            </tbody>
        </table>

        <!-- ===== 2. 배송 정보 ===== -->
        <h2 class="section-title">배송 정보</h2>
        <div class="form order-form">
            <label for="receiverName">받는 분</label>
            <input type="text" th:field="*{receiverName}">
            <p class="error" th:if="${#fields.hasErrors('receiverName')}" th:errors="*{receiverName}"></p>

            <label for="phone">연락처</label>
            <input type="text" th:field="*{phone}" placeholder="010-1234-5678">
            <p class="error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></p>

            <label for="address">배송 주소</label>
            <input type="text" th:field="*{address}" placeholder="예) 서울시 강남구 테헤란로 123, 101동 1001호">
            <p class="error" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></p>
        </div>

        <!-- ===== 3. 결제 금액 ===== -->
        <div class="cart-summary">
            <p>총 <strong th:text="${#lists.size(lines)}">0</strong>개 상품 · 배송비 <strong>무료</strong></p>
            <p class="cart-total">
                최종 결제 금액
                <strong th:text="${#numbers.formatInteger(totalPrice, 3, 'COMMA')} + '원'">0원</strong>
            </p>
            <button type="submit" class="button button-pay">결제하기</button>
        </div>
        <p class="pay-notice">※ 연습용 쇼핑몰이라 실제 결제는 되지 않고 주문만 저장돼요.</p>
    </form>
</main>

</body>
</html>
