<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주문 상세 - SHOP2</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header th:replace="~{fragments/header :: header}"></header>

<main class="container">
    <a class="back-link" th:href="@{/orders}">← 주문 내역으로</a>

    <!-- 결제 직후 안내 문구 -->
    <p class="alert" th:if="${message}" th:text="${message}"></p>

    <h1>주문 상세</h1>

    <!-- ===== 주문 정보 ===== -->
    <h2 class="section-title">주문 정보</h2>
    <table class="info-table">
        <tr>
            <th>주문번호</th>
            <td th:text="${order.id}"></td>
        </tr>
        <tr>
            <th>주문일</th>
            <td th:text="${#temporals.format(order.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
        </tr>
        <tr>
            <th>상태</th>
            <td><span class="badge" th:text="${order.statusName}">주문완료</span></td>
        </tr>
        <tr>
            <th>받는 분</th>
            <td th:text="${order.receiverName}"></td>
        </tr>
        <tr>
            <th>연락처</th>
            <td th:text="${order.phone}"></td>
        </tr>
        <tr>
            <th>배송 주소</th>
            <td th:text="${order.address}"></td>
        </tr>
    </table>

    <!-- ===== 주문 상품 ===== -->
    <h2 class="section-title">주문 상품</h2>
    <table class="cart-table">
        <thead>
        <tr>
            <th>상품</th>
            <th class="col-price">가격</th>
            <th class="col-qty">수량</th>
            <th class="col-price">합계</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="item : ${order.items}">
            <td>
                <a class="cart-product" th:href="@{/products/{id}(id=${item.productId})}">
                    <div>
                        <p class="product-brand" th:text="${item.brand}">브랜드</p>
                        <p class="cart-product-name" th:text="${item.productName}">상품 이름</p>
                    </div>
                </a>
            </td>
            <!-- 주문 당시 가격 (지금 상품 가격이 바뀌어도 그대로예요) -->
            <td class="col-price"
                th:text="${#numbers.formatInteger(item.price, 3, 'COMMA')} + '원'">0원</td>
            <td class="col-qty" th:text="${item.quantity} + '개'">1개</td>
            <td class="col-price cart-line-total"
                th:text="${#numbers.formatInteger(item.totalPrice, 3, 'COMMA')} + '원'">0원</td>
        </tr>
        </tbody>
    </table>

    <div class="cart-summary">
        <p class="cart-total">
            결제 금액
            <strong th:text="${#numbers.formatInteger(order.totalPrice, 3, 'COMMA')} + '원'">0원</strong>
        </p>
    </div>
</main>

</body>
</html>
