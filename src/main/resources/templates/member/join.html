<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 - SHOP2</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<!-- 공통 상단 메뉴 불러오기 -->
<header th:replace="~{fragments/header :: header}"></header>

<main class="container narrow">
    <h1>회원가입</h1>

    <!--
        th:object="${joinForm}" → 컨트롤러에서 넘겨준 MemberJoinForm과 연결
        th:field="*{username}"  → joinForm.username과 연결 (id, name, value 자동 생성)
        th:errors="*{username}" → username 검사에서 걸린 오류 문구 출력
        th:action을 쓰면 보안용 CSRF 토큰이 자동으로 들어가요
    -->
    <form th:action="@{/join}" th:object="${joinForm}" method="post" class="form">

        <label for="username">아이디</label>
        <input type="text" th:field="*{username}" placeholder="영문, 숫자 4~20자">
        <p class="error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></p>

        <label for="password">비밀번호</label>
        <input type="password" id="password" name="password" placeholder="8~20자">
        <p class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>

        <label for="passwordConfirm">비밀번호 확인</label>
        <input type="password" id="passwordConfirm" name="passwordConfirm" placeholder="비밀번호를 한 번 더 입력">
        <p class="error" th:if="${#fields.hasErrors('passwordConfirm')}" th:errors="*{passwordConfirm}"></p>

        <label for="name">이름</label>
        <input type="text" th:field="*{name}">
        <p class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>

        <label for="email">이메일</label>
        <input type="email" th:field="*{email}" placeholder="example@email.com">
        <p class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>

        <button type="submit" class="button">가입하기</button>
    </form>

    <p class="sub-link">
        이미 회원이신가요? <a th:href="@{/login}">로그인</a>
    </p>
</main>

</body>
</html>
